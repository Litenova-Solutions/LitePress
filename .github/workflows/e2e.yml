name: E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"
  pull_request:
    paths:
      - "apps/web/**"
      - "apps/api/**"
      - "packages/**"

jobs:
  publish-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: litepress
          POSTGRES_PASSWORD: litepress
          POSTGRES_DB: litepress
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ConnectionStrings__Database: Host=localhost;Port=5432;Database=litepress;Username=litepress;Password=litepress
      JwtSettings__Secret: dev-secret-key-must-be-at-least-32-characters-long!
      E2E_API_URL: http://localhost:5000
      API_JWT_SECRET: dev-secret-key-must-be-at-least-32-characters-long!
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      API_URL: http://localhost:5000
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json

      - name: Restore and build API
        run: |
          dotnet restore LitePress.slnx
          dotnet build LitePress.slnx --configuration Release --no-restore

      - name: Install EF Core tools
        run: dotnet tool install --global dotnet-ef --version 10.0.4

      - name: Apply database migrations
        run: |
          dotnet ef database update \
            --project src/LitePress.Infrastructure \
            --startup-project src/LitePress.WebApi \
            --configuration Release

      - name: Start API
        run: |
          dotnet run --project src/LitePress.WebApi --configuration Release --no-build --urls http://localhost:5000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/openapi/v1.json && break
            sleep 2
          done
          curl -sf http://localhost:5000/openapi/v1.json

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm turbo build --filter=web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright publish flow
        working-directory: apps/web
        run: pnpm exec playwright test
