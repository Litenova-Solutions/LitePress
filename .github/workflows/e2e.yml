name: E2E

# Temporarily manual-only while Marten migration and acceptance tests are in progress.
on:
  workflow_dispatch:

jobs:
  publish-flow:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    env:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=127.0.0.1;Port=5432;Database=litepress;Username=litepress;Password=litepress
      Database__ApplySchemaOnStartup: "true"
      JwtSettings__Secret: dev-secret-key-must-be-at-least-32-characters-long!
      E2E_API_URL: http://localhost:5000
      API_JWT_SECRET: dev-secret-key-must-be-at-least-32-characters-long!
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      API_URL: http://localhost:5000
      SITE_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: apps/api/global.json

      - name: Start PostgreSQL
        working-directory: .
        run: |
          docker run -d --name litepress-postgres -p 5432:5432 \
            -e POSTGRES_USER=litepress -e POSTGRES_PASSWORD=litepress -e POSTGRES_DB=litepress \
            postgres:17-alpine
          for i in $(seq 1 30); do
            docker exec litepress-postgres pg_isready -U litepress -d litepress && break
            sleep 2
          done
          docker exec litepress-postgres pg_isready -U litepress -d litepress

      - name: Restore and build API
        run: |
          dotnet restore LitePress.slnx
          dotnet build LitePress.slnx --configuration Release --no-restore

      - name: Start API
        run: |
          dotnet run --project src/LitePress.WebApi --configuration Release --no-build --urls http://localhost:5000 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/openapi/v1.json && break
            sleep 2
          done
          curl -sf http://localhost:5000/openapi/v1.json

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Build web app
        run: pnpm turbo build --filter=web

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Playwright publish flow
        working-directory: apps/web
        run: pnpm exec playwright test
